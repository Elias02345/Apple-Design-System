<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Stillform release cover</title>
<style>
*{box-sizing:border-box}body{margin:0;color:#212820;background:#f2efe6;font-family:system-ui,sans-serif}
main{height:100vh;display:grid;grid-template-columns:46% 54%}
.copy{display:flex;flex-direction:column;padding:58px 56px 46px 68px;justify-content:space-between}
.brand{display:flex;gap:14px;align-items:center;font-weight:650;font-size:20px;letter-spacing:-.025em}
.mark{width:34px;height:34px;border:1px solid;border-radius:50%;background:repeating-linear-gradient(-54deg,transparent 0 3px,#26382b 3px 5px)}
h1{margin:0 0 16px;font:normal 127px/.98 Georgia,serif;letter-spacing:-.083em}
p{margin:0;font-size:31px;line-height:1.18;letter-spacing:-.045em;font-weight:450;max-width:480px}
footer{padding-top:18px;border-top:1px solid #91988b;font:15px/1.5 Consolas,monospace;letter-spacing:.015em}
.plates{display:grid;grid-template-rows:53% 47%;overflow:hidden}
.fossil{background:url('../skills/stillform/assets/web/ammonite.webp') 58% 50% / cover}
.tide{background:#102c30;overflow:hidden;position:relative}
.tide img{position:absolute;width:100%;height:auto;left:0;top:-58%}
</style></head><body><main><div class="copy"><div class="brand"><span class="mark"></span>Apple Design System</div>

<footer>Interaction design · SwiftUI · Web</footer></div>
<div class="plates"><div class="fossil"></div><div class="tide"><img src="../showcase/tide.png" alt="Tide book interface"></div></div></main></body></html>
