name: Validate Stillform
on:
  push:
    branches: [dev, main, 'feature/**', 'fix/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browsers:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble@sha256:6446946a1d9fd62d9ae501312a2d76a43ee688542b21622056a372959b65d63d
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: python3 tests/test_skill.py
  native:
    runs-on: macos-15
    defaults:
      run:
        working-directory: skills/stillform/assets/swift
    steps:
      - uses: actions/checkout@v4
      - run: STILLFORM_NATIVE_CAPTURES="$RUNNER_TEMP/native-captures" swift test
      - run: xcodebuild -scheme FieldKit -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/stillform-ios" CODE_SIGNING_ALLOWED=NO build
      - uses: actions/upload-artifact@v4
        with:
          name: native-captures
          path: ${{ runner.temp }}/native-captures
  platform-surfaces:
    runs-on: macos-15
    defaults:
      run:
        working-directory: skills/stillform/assets/apple-surfaces
    steps:
      - uses: actions/checkout@v4
      - run: swift test
      - name: Build Watch, TV and Vision library views
        run: |
          for pair in watchos:arm64_32-apple-watchos10.0 appletvos:arm64-apple-tvos17.0 xros:arm64-apple-xros1.0; do
            sdk="${pair%%:*}"
            target="${pair#*:}"
            echo "Building SurfaceKit for $target"
            xcrun --sdk "$sdk" swiftc -sdk "$(xcrun --sdk "$sdk" --show-sdk-path)" -target "$target" \
              -module-name SurfaceKit -parse-as-library -emit-library Sources/SurfaceKit/*.swift \
              -o "$RUNNER_TEMP/libSurfaceKit-$sdk.dylib"
          done
