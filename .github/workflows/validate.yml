name: Validate Stillform
on:
  push:
    branches: [dev, main, 'feature/**', 'fix/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browsers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm test
      - run: python tests/test_skill.py
  native:
    runs-on: macos-15
    defaults:
      run:
        working-directory: skills/stillform/assets/swift
    steps:
      - uses: actions/checkout@v4
      - run: STILLFORM_NATIVE_CAPTURES="$RUNNER_TEMP/native-captures" swift test
      - run: xcodebuild -scheme FieldKit -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/stillform-ios" CODE_SIGNING_ALLOWED=NO build
      - uses: actions/upload-artifact@v4
        with:
          name: native-captures
          path: ${{ runner.temp }}/native-captures
  platform-surfaces:
    runs-on: macos-15
    defaults:
      run:
        working-directory: skills/stillform/assets/apple-surfaces
    steps:
      - uses: actions/checkout@v4
      - run: swift test
      - name: Build Watch, TV and Vision library views
        run: |
          for platform in watchOS tvOS visionOS; do
            xcodebuild -scheme SurfaceKit -destination "generic/platform=$platform" -derivedDataPath "$RUNNER_TEMP/stillform-$platform" CODE_SIGNING_ALLOWED=NO build
          done
